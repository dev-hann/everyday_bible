name: everydaybible
description: Everyday Read Bible Amen.

version: 3.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  http: ^1.6.0
  intl: ^0.20.3

  # UI
  font_awesome_flutter: ^11.0.0
  flutter_slidable: ^4.0.3
  table_calendar: ^3.2.1
  highlight_text: ^1.8.0

  # Database
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  # StateManage
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1

  # Network
  dio: ^5.11.1

  # Utils
  equatable: ^3.0.0
  fpdart: ^1.2.0
  html: ^0.15.7
  collection: ^1.19.1

  just_audio: ^0.10.6
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
flutter:
  uses-material-design: true
  fonts:
    - family: Fondamento
      fonts:
        - asset: assets/fonts/Fondamento-Regular.ttf
    - family: Norican
      fonts:
        - asset: assets/fonts/Norican-Regular.ttf

  assets:
    - assets/
    - assets/data/bible.json
