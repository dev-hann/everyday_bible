name: everydaybible
description: Everyday Read Bible Amen.

version: 3.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  bloc: ^9.2.1
  collection: ^1.19.1
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  firebase_ai: ^5.1.0
  firebase_app_check: ^0.5.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_slidable: ^4.0.3
  font_awesome_flutter: ^11.0.0
  fpdart: ^1.2.0
  highlight_text: ^1.8.0
  html: ^0.15.7
  http: ^1.6.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  table_calendar: ^3.3.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
flutter:
  uses-material-design: true
  fonts:
    - family: Fondamento
      fonts:
        - asset: assets/fonts/Fondamento-Regular.ttf
    - family: Norican
      fonts:
        - asset: assets/fonts/Norican-Regular.ttf

  assets:
    - assets/
    - assets/data/bible.json
